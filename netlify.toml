[build]
command = "pnpm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

# SPA fallback for react-router: the site is fully static, so every path serves
# the app and the router takes it from there.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# The service worker must never be served stale, or an old one pins old assets.
[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Cache-Control = "no-cache"

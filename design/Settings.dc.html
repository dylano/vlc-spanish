<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2f6d4f; } a:hover { color: #191d1a; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #faf8f4; font-family: 'Public Sans', system-ui, sans-serif; color: #191d1a; display: flex; flex-direction: column; padding: 56px 28px 28px; box-sizing: border-box;">
  <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 40px; line-height: 1.05;">Settings</div>

  <div style="margin-top: 34px;">
    <div style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #6f7872; margin-bottom: 4px;">Who is practising</div>
    <div style="border-top: 1px solid #e6e1d8;">
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; border-bottom: 1px solid #e6e1d8;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px;">Dylan</span>
        <span style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #2f6d4f;">Practising</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; border-bottom: 1px solid #e6e1d8;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px;">Brenda</span>
        
      </div>
    </div>
  </div>

  <div style="margin-top: 34px;">
    <div style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #6f7872; margin-bottom: 4px;">The dictionary</div>
    <div style="border-top: 1px solid #e6e1d8;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #e6e1d8;">
        <span style="font-size: 13px; color: #6f7872;">Words</span>
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 22px;">159</span>
      </div>
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #e6e1d8;">
        <span style="font-size: 13px; color: #6f7872;">Sections</span>
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 22px;">10</span>
      </div>
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #e6e1d8;">
        <span style="font-size: 13px; color: #6f7872;">You have practised</span>
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 22px;">11</span>
      </div>
    </div>
    <div style="font-size: 13px; line-height: 1.5; color: #6f7872; margin-top: 14px;">Shared by everyone. New words are added from the dictionary file.</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; gap: 28px; padding-top: 18px; border-top: 1px solid #e6e1d8; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6f7872;">
    <span>Home</span>
    <span>Dictionary</span>
    <span style="color: #191d1a;">Settings</span>
  </div>
</div>
</x-dc>
</body>
</html>

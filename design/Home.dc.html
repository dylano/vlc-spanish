<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;500;600&display=swap"
        />
        <style>
          body {
            margin: 0;
          }
          a {
            color: #2f6d4f;
          }
          a:hover {
            color: #191d1a;
          }
        </style>
      </helmet>
      <div
        style="
          width: 390px;
          height: 844px;
          background: #faf8f4;
          font-family: &quot;Public Sans&quot;, system-ui, sans-serif;
          color: #191d1a;
          display: flex;
          flex-direction: column;
          padding: 56px 28px 28px;
          box-sizing: border-box;
        "
      >
        <div
          style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #6f7872"
        >
          Wednesday, 16 September
        </div>
        <div
          style="
            font-family: &quot;Instrument Serif&quot;, Georgia, serif;
            font-size: 46px;
            line-height: 1.05;
            margin-top: 10px;
          "
        >
          Hola, Dylan
        </div>

        <div
          style="
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: 8px;
          "
        >
          <div style="border-top: 1px solid #e6e1d8">
            <a
              href="#"
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                min-height: 92px;
                border-bottom: 1px solid #e6e1d8;
                font-family: &quot;Instrument Serif&quot;, Georgia, serif;
                font-size: 36px;
                color: #2f6d4f;
                text-decoration: none;
              "
            >
              Practice
              <svg
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
                stroke="#6f7872"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M7 4l6 6-6 6" />
              </svg>
            </a>
            <a
              href="#"
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                min-height: 72px;
                border-bottom: 1px solid #e6e1d8;
                font-family: &quot;Instrument Serif&quot;, Georgia, serif;
                font-size: 20px;
                color: #6f7872;
                text-decoration: none;
              "
            >
              Only words I have not seen
              <svg
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
                stroke="#6f7872"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M7 4l6 6-6 6" />
              </svg>
            </a>
            <a
              href="#"
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                min-height: 72px;
                border-bottom: 1px solid #e6e1d8;
                font-family: &quot;Instrument Serif&quot;, Georgia, serif;
                font-size: 20px;
                color: #6f7872;
                text-decoration: none;
              "
            >
              Only ones I have got wrong
              <svg
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
                stroke="#6f7872"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M7 4l6 6-6 6" />
              </svg>
            </a>
          </div>
        </div>

        <div
          style="
            display: flex;
            gap: 28px;
            padding-top: 18px;
            border-top: 1px solid #e6e1d8;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #6f7872;
          "
        >
          <span style="color: #191d1a">Home</span>
          <span>Dictionary</span>
          <span>Settings</span>
        </div>
      </div>
    </x-dc>
  </body>
</html>
